version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-No", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth.api:
    image: prolanguage.auth
    build:
      context: ./Auth
      dockerfile: Dockerfile
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KeyVault__Endpoint=
      - ConnectionStrings__AuthConnection=${AUTH_CONNECTION_STRING}
      - ConnectionStrings__ServiceBus=${SERVICEBUS_CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - GoogleAuth__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy

  payments.api:
    image: prolanguage.payments
    build:
      context: ./Payments
      dockerfile: Dockerfile
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KeyVault__Endpoint=
      - ConnectionStrings__PaymentsConnection=${PAYMENTS_CONNECTION_STRING}
    depends_on:
      sqlserver:
        condition: service_healthy

  prolanguage.api:
    image: prolanguage.web
    build:
      context: ./ProLanguage
      dockerfile: Dockerfile
    ports:
      - "5201:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KeyVault__Endpoint=
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION_STRING}
      - AzureBlobStorage__ConnectionString=${AZURE_BLOB_CONNECTION_STRING}
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
      - AzureOpenAI__DeploymentName=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5-mini}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - PaymentSettings__PaymentServiceUrl=http://payments.api:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      payments.api:
        condition: service_started

  prolanguage.ui:
    image: prolanguage.ui
    build:
      context: ./prolanguage-ui-app
      dockerfile: Dockerfile
    ports:
      - "4200:80"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - auth.api
      - payments.api
      - prolanguage.api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  azurite_data:
