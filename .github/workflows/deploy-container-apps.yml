name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated login to Azure
  contents: read

env:
  RESOURCE_GROUP: rg-prolanguage-prod-plc-001
  ACR_LOGIN_SERVER: prolanguage.azurecr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: prolanguage-auth
            image: prolanguage-auth
            context: ./Auth
            dockerfile: ./Auth/Dockerfile
          - app: prolanguage-payments
            image: prolanguage-payments
            context: ./Payments
            dockerfile: ./Payments/Dockerfile
          - app: prolanguage-web
            image: prolanguage-web
            context: ./ProLanguage
            dockerfile: ./ProLanguage/Dockerfile
          # UI: container app is named `prolanguage` but image repo is `prolanguage-ui`
          - app: prolanguage
            image: prolanguage-ui
            context: ./prolanguage-ui-app
            dockerfile: ./prolanguage-ui-app/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE_SHA=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          IMAGE_LATEST=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Container App
        run: |
          set -euo pipefail
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          EXTRA_ARGS=()

          # The web app calls the Payments app server-to-server. In Container Apps
          # that hop goes over the Payments app's ingress FQDN on 443 (not :8080,
          # not localhost), so point PaymentSettings__PaymentServiceUrl at it.
          if [ "${{ matrix.app }}" = "prolanguage-web" ]; then
            PAYMENTS_FQDN=$(az containerapp show \
              -n prolanguage-payments \
              -g "${{ env.RESOURCE_GROUP }}" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            if [ -z "$PAYMENTS_FQDN" ]; then
              echo "ERROR: prolanguage-payments has no ingress FQDN. Enable ingress" \
                   "(internal is enough) on it so the web app can reach it." >&2
              exit 1
            fi
            echo "Routing payments to https://$PAYMENTS_FQDN"
            EXTRA_ARGS+=(--set-env-vars "PaymentSettings__PaymentServiceUrl=https://$PAYMENTS_FQDN")
          fi

          # The auth app builds the emailed password-reset link from
          # EmailSettings__FrontendUrl. Point it at the public UI app so links open
          # the deployed site instead of localhost.
          if [ "${{ matrix.app }}" = "prolanguage-auth" ]; then
            UI_FQDN=$(az containerapp show \
              -n prolanguage \
              -g "${{ env.RESOURCE_GROUP }}" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            if [ -z "$UI_FQDN" ]; then
              echo "ERROR: prolanguage (UI) has no ingress FQDN; cannot set the reset-link base URL." >&2
              exit 1
            fi
            echo "Password-reset links will use https://$UI_FQDN"
            EXTRA_ARGS+=(--set-env-vars "EmailSettings__FrontendUrl=https://$UI_FQDN")
          fi

          az containerapp update \
            -n ${{ matrix.app }} \
            -g "${{ env.RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            "${EXTRA_ARGS[@]}"
