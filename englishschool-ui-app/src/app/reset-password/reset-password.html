<div class="reset-password-page">
  <div class="background-pattern"></div>
  <div class="wave-top"></div>
  <div class="wave-bottom"></div>

  <a routerLink="/" class="logo">
    <img src="ProLanguage.png" alt="Pro Language" class="logo-image" />
  </a>

  <div class="reset-password-content">
    <h1 class="title">Reset <span class="highlight">Password</span></h1>

    <div class="reset-password-card">
      @if (!isSubmitted) {
        <p class="description">
          Enter your new password below.
        </p>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group password-group">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="newPassword"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="New Password"
              class="form-input"
              required
            />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                @if (showPassword) {
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                } @else {
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                }
              </svg>
            </button>
          </div>

          <div class="form-group password-group">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm Password"
              class="form-input"
              required
            />
            <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                @if (showConfirmPassword) {
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                } @else {
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                }
              </svg>
            </button>
          </div>

          <div class="password-requirements">
            <p>Password must:</p>
            <ul>
              <li [class.valid]="newPassword.length >= 6">Be at least 6 characters</li>
              <li [class.valid]="newPassword === confirmPassword && newPassword.length > 0">Match confirmation</li>
            </ul>
          </div>

          @if (errorMessage) {
            <div class="error-message">{{ errorMessage }}</div>
          }

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            @if (isLoading) {
              Resetting...
            } @else {
              Reset Password
            }
          </button>
        </form>
      } @else {
        <div class="success-container">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <p class="success-message">{{ successMessage }}</p>
          <p class="redirect-notice">Redirecting to sign in page...</p>
        </div>
      }

      <div class="back-link-container">
        <a routerLink="/signin" class="back-link">
          <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>
