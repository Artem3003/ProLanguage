# Resolver for dynamic upstream lookup (Azure DNS).
# Container Apps internal FQDNs are resolved at request time, not at nginx start,
# so the container survives backend redeploys without needing a restart.
resolver 168.63.129.16 valid=30s ipv6=off;

# Backend FQDNs (internal Container Apps ingress, HTTPS on port 443)
map $request_uri $auth_backend {
    default https://prolanguage-auth.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
}
map $request_uri $payments_backend {
    default https://prolanguage-payments.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
}
map $request_uri $web_backend {
    default https://prolanguage-web.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Auth API: AuthController, UsersController, RolesController, ContactController
    location ~ ^/api/(auth|users|roles|contact)(/.*)?$ {
        proxy_pass $auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-auth.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
    }

    # Payments API: PaymentsController, TransactionsController
    location ~ ^/api/(payments|transactions)(/.*)?$ {
        proxy_pass $payments_backend;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-payments.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
    }

    # Web API: Courses, Lessons, Orders, Comments, Assignments, Homeworks, Calendar, AiChat
    location ~ ^/api/(courses|lessons|orders|comments|assignments|homeworks|calendar|aichat)(/.*)?$ {
        proxy_pass $web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-web.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
    }

    # Angular SPA — all other paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
