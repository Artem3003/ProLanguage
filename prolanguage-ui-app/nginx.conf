server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Auth API: AuthController, UsersController, RolesController, ContactController
    location ~ ^/api/(auth|users|roles|contact)(/.*)?$ {
        proxy_pass https://prolanguage-auth.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-auth.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Payments API: PaymentsController, TransactionsController
    location ~ ^/api/(payments|transactions)(/.*)?$ {
        proxy_pass https://prolanguage-payments.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-payments.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Web API: Courses, Lessons, Orders, Comments, Assignments, Homeworks, Calendar, AiChat
    location ~ ^/api/(courses|lessons|orders|comments|assignments|homeworks|calendar|aichat)(/.*)?$ {
        proxy_pass https://prolanguage-web.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host prolanguage-web.internal.victorioushill-7ea66ddd.polandcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Hashed assets (main-XXX.js, styles-XXX.css, etc.) — cache aggressively, filename changes invalidate
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — NEVER cache, so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Angular SPA — all other paths fall through to index.html (also no-cache)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
