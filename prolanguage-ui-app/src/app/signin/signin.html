<div class="signin-page">
  <div class="background-pattern"></div>

  <a routerLink="/" class="logo">
    <img src="ProLanguage.png" alt="Pro Language" class="logo-image" />
  </a>

  <div class="signin-content">
    <h1 class="title">Sign <span class="highlight">In</span></h1>

    <div class="signin-card">
      <!-- The real Google button is rendered transparently on top of the styled
           button so a genuine user click reaches Google Identity Services. -->
      <div class="google-btn-wrapper">
        <button type="button" class="social-btn google-btn" tabindex="-1" aria-hidden="true">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <div #googleButton class="google-signin-container"></div>
      </div>

      <button type="button" class="social-btn apple-btn" (click)="onAppleSignIn()" [disabled]="isAppleLoading">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path fill="#000" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        @if (isAppleLoading) {
          Signing in...
        } @else {
          Continue with Apple
        }
      </button>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            class="form-input"
            required
          />
        </div>

        <div class="form-group password-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            class="form-input"
            required
          />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              @if (showPassword) {
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              } @else {
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              }
            </svg>
          </button>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="checkbox" />
            <span class="checkmark"></span>
            Remember Me
          </label>
          <a routerLink="/forgot-password" class="forgot-link">Forget password?</a>
        </div>

        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }

        <button type="submit" class="signin-btn" [disabled]="isLoading">
          @if (isLoading) {
            Signing in...
          } @else {
            Sign In
          }
        </button>
      </form>

      <p class="signup-text">
        Don't have an account? <a routerLink="/register" class="signup-link">Sign up</a>
      </p>
    </div>
  </div>
</div>
