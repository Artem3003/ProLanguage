<div class="forgot-password-page">
  <div class="background-pattern"></div>
  <div class="wave-top"></div>
  <div class="wave-bottom"></div>

  <a routerLink="/" class="logo">
    <img src="ProLanguage.png" alt="Pro Language" class="logo-image" />
  </a>

  <div class="forgot-password-content">
    <h1 class="title">Forgot <span class="highlight">Password</span></h1>

    <div class="forgot-password-card">
      @if (!isSubmitted) {
        <p class="description">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Email"
              class="form-input"
              required
            />
          </div>

          @if (errorMessage) {
            <div class="error-message">{{ errorMessage }}</div>
          }

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            @if (isLoading) {
              Sending...
            } @else {
              Send Reset Link
            }
          </button>
        </form>
      } @else {
        <div class="success-container">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <p class="success-message">{{ successMessage }}</p>
          <p class="redirect-notice">Please check your email inbox and click the reset link.</p>
        </div>
      }

      <div class="back-link-container">
        <a routerLink="/signin" class="back-link">
          <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>
