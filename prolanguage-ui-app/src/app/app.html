@if (isFullScreenRoute()) {
  <router-outlet></router-outlet>
} @else {
  <app-header></app-header>
  <div class="container">
    <!-- Admin Panel Toggle Button (only visible for admins) -->
    @if (isAdmin()) {
      <button class="admin-panel-toggle" (click)="toggleAdminPanel()" [class.open]="isAdminPanelOpen()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Admin</span>
      </button>
    }

    <!-- Admin Sidebar (only visible for admins when toggled) -->
    @if (isAdmin() && isAdminPanelOpen()) {
      <div class="sidebar admin-sidebar">
        <div class="admin-header">
          <h3>Admin Panel</h3>
          <button class="close-btn" (click)="toggleAdminPanel()">&times;</button>
        </div>
        <nav>
          <a routerLink="/admin/courses" routerLinkActive="active">Courses</a>
          <a routerLink="/lessons" routerLinkActive="active">Lessons</a>
          <a routerLink="/homeworks" routerLinkActive="active">Homeworks</a>
          <a routerLink="/assignments" routerLinkActive="active">Assignments</a>
          <a routerLink="/calendar" routerLinkActive="active">Calendar</a>
          <a routerLink="/orders" routerLinkActive="active">Orders</a>
          <a routerLink="/comments" routerLinkActive="active">Comments</a>
        </nav>
      </div>
    }

    <main class="content" [class.with-sidebar]="isAdmin() && isAdminPanelOpen()">
      <div class="header-bar">
        <app-cart-icon></app-cart-icon>
      </div>
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-footer></app-footer>
}
